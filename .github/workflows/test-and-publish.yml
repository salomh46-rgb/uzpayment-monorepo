name: Test and Validate SDKs

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm --prefix packages/uzpayment-node install
      - name: Build Node SDK
        run: npm --prefix packages/uzpayment-node run build
      - name: Run Node tests
        run: npm --prefix packages/uzpayment-node test

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          pip install pytest httpx
          pip install -e packages/uzpayment-python
      - name: Run Python tests
        run: |
          cd packages/uzpayment-python
          pytest tests
